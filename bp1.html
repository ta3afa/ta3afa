<!-- قسم الأهداف -->
 <div class="background_bp1">
 <h1 class="h1">أهداف اليوم</h1>
 <h2 class="h2">(لا تنسى حتى لأشياء الصغيرة تحدت فرقا )</h2>
 

<div class="goals">

<div class="goal">
<input type="checkbox">
<button class="plus">+</button>
<input type="text" class="goal_input" placeholder=" الهدف 1">
</div>

<div class="goal">
<input type="checkbox">
<button class="plus">+</button>
<input type="text" class="goal_input" placeholder="الهدف 2">
</div>

<div class="goal">
<input type="checkbox">
<button class="plus">+</button>
<input type="text" class="goal_input" placeholder="الهدف 3">
</div>

</div>
<button 
class="button">أكملت مهامي</button>
</div>



<script>

const buttons = document.querySelectorAll(".plus");

buttons.forEach(button => {

button.addEventListener("click", function(){

let input = this.nextElementSibling;

if(input.style.display === "flex"){
input.style.display = "none";
}else{
input.style.display = "flex";
}

});

});




const completeBtn = document.querySelector(".button");

completeBtn.addEventListener("click", () => {

const goals = document.querySelectorAll(".goal");

let hasGoal = false;
let allCompleted = true;

goals.forEach(goal => {

const input = goal.querySelector(".goal_input");
const checkbox = goal.querySelector('input[type="checkbox"]');

if(input.value.trim() !== ""){

hasGoal = true;

if(!checkbox.checked){
allCompleted = false;
}

}

});

if(!hasGoal){
alert("أضف هدفاً واحداً على الأقل");
return;
}

if(!allCompleted){
alert("قم بتعليم جميع المهام المكتملة");
return;
}

const message = document.getElementById("successMessage");

message.style.display = "block";

setTimeout(() => {
message.style.display = "none";
}, 3000);

});



</script>
