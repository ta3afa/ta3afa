        <title>log in</title>

    <body>
        <form class="login_1">
            <h1> Log in</h1>
            <label for="email">Enter email</label>
            <input
            type="email"
            id="email"
            name="email"
            placeholder="email"
            required>
            <label for="password">Enter password</label>
            <input 
            type="password"
            id="password"
            name="password"
            placeholder="password"
            required>
            <button
            class="button_2"
            onclick="login()">Enter</button>
        </form>
        <script>
          
function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  fetch("http:// 127.0.0.1:8080/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email: email,
      password: password
    })
  })
  .then(res => res.text())
  .then(result => {
    if (result === "OK") {
      window.location.href = "gallery_1.html";
    } else {
      alert("Information Error");
    }
  })
  .catch(err => {
    alert("Server not running");
  });
}
        </script>



      
    </body>
